# Portal Scanner Configuration — Luxembourg Finance & Accounting Jobs

title_filter:
  positive:
    # Finance & Accounting
    - "Accountant"
    - "Accounting"
    - "Finance"
    - "Financial"
    - "Accounts Payable"
    - "Accounts Receivable"
    - "AP"
    - "AR"
    - "Credit Control"
    - "Bookkeeper"
    - "Bookkeeping"
    - "Controller"
    - "Comptable"        # French: accountant
    - "Finance Officer"
    - "Finance Analyst"
    - "Financial Analyst"
    - "Treasury"
    # Administrative
    - "Administrative"
    - "Administration"
    - "Admin Officer"
    - "Office Manager"
    - "Operations Officer"
    - "Assistant administratif"
    # Procurement / Operations
    - "Procurement"
    - "Purchasing"
    - "Supply Chain"
    # Data / Reporting
    - "Data Analyst"
    - "Reporting Analyst"
    - "Business Analyst"
    - "Power BI"
  negative:
    - "Intern"
    - "Trainee"
    - "Stage"            # French: internship
    - "Senior Director"
    - "VP "
    - "Chief "
    - "C-level"
    - "Software Engineer"
    - "Developer"
    - "IT Manager"
    - "Marketing"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Manager"
    - "Officer"
    - "Specialist"

# --- Search queries for Luxembourg job boards ---
search_queries:

  - name: LinkedIn — Luxembourg Finance
    query: 'site:linkedin.com/jobs "Luxembourg" "accountant" OR "finance officer" OR "accounts payable" OR "accounts receivable"'
    enabled: true

  - name: EuroJobs — Luxembourg Accounting
    query: 'site:eurojobs.com Luxembourg accountant OR "finance officer" OR "accounts payable"'
    enabled: true

  - name: Indeed Luxembourg — Finance
    query: 'site:indeed.com/jobs "Luxembourg" accountant OR "financial analyst" OR "finance officer" OR "credit control"'
    enabled: true

  - name: Jobs.lu — Finance & Accounting
    query: 'site:jobs.lu accountant OR "finance officer" OR "accounts payable" OR comptable'
    enabled: true

  - name: Moovijob Luxembourg — Accounting
    query: 'site:moovijob.com Luxembourg accountant OR finance OR comptable OR "administrative officer"'
    enabled: true

  - name: Careers.lu — Finance
    query: 'site:careers.lu Luxembourg accountant OR "finance officer" OR "data analyst"'
    enabled: true

  - name: Glassdoor Luxembourg — Finance
    query: 'site:glassdoor.com Luxembourg "accountant" OR "finance analyst" OR "accounts payable officer"'
    enabled: true

  - name: Luxembourg Finance — Administrative
    query: '"Luxembourg" "administrative officer" OR "office administrator" OR "operations officer" finance'
    enabled: true

  - name: Luxembourg — Power BI / Data Finance
    query: '"Luxembourg" "Power BI" OR "data analyst" finance OR accounting OR reporting'
    enabled: true

# --- Key employers in Luxembourg (finance, banking, funds, EU institutions) ---
tracked_companies:

  # -- EU Institutions (major Luxembourg employers) --
  - name: European Commission Luxembourg
    careers_url: https://epso.europa.eu/en/job-opportunities
    scan_method: websearch
    scan_query: '"European Commission" Luxembourg "finance" OR "accounting" OR "administrative" jobs'
    notes: "EU institutions — major employer in Luxembourg"
    enabled: true

  - name: European Court of Auditors
    careers_url: https://www.eca.europa.eu/en/Pages/Vacancies.aspx
    scan_method: websearch
    scan_query: '"European Court of Auditors" Luxembourg vacancies finance OR accounting OR administrative'
    enabled: true

  - name: EIB — European Investment Bank
    careers_url: https://www.eib.org/en/about/jobs/index.htm
    scan_method: websearch
    scan_query: '"European Investment Bank" Luxembourg jobs finance OR accountant OR analyst'
    enabled: true

  - name: Eurostat
